<!DOCTYPE html>

<html lang="en">

<head>
  
  <!-- meta tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- links font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <!-- links icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  
  <!-- links favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <!-- links styles -->
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Product preview card component</title>

</head>

<body>
  
  <!-- main content -->
  <main class="main-content">
    
    <!-- container img -->
    <section class="container-img">
      
      <!-- picture img -->
      <picture>

        <source media="(max-width: 768px)" srcset="images/image-product-mobile.jpg" type="image/jpeg">

        <img src="images/image-product-desktop.jpg" alt="image-product">

      </picture>
      <!-- Fim picture img -->

    </section>
    <!-- fim box img -->

    <!-- container description-->
    <section class="container-description">
      
      <span>Perfume</span>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p>
        A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.
      </p>
      
      <!-- box price -->
      <div class="box-price">
        
        <p>$149.99</p>
        
        <span>$169.99</span>
      
      </div>
      <!-- fim box price -->
      
      <!-- btn  container description-->
      <button>
        
        <i class="bi bi-cart3"></i>
        
        Add to Cart
      
      </button>
      <!-- Fim btn container description-->
    
    </section>
    <!-- fim container description-->
  
  </main>

</body>

</html>
